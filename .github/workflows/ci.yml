name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        task: [check, eslint, "prettier:check"]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          check-latest: true
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar tipos de Astro
        run: pnpm sync

      - name: Ejecutar comprobación
        run: pnpm ${{ matrix.task }}

  build:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          check-latest: true
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar build de producción
        run: pnpm build
